name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      # Signing in needs the admin credentials and an SMS code, so CI lists the
      # suite instead of running it until those are available as secrets.
      - name: List the suite
        run: npx playwright test --list
        env:
          TEST_ENV: prod
          ADMIN_BASE_URL: https://admin.govectora.com
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: reports/
          retention-days: 30
